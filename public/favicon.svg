<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Deep Space Backdrop -->
  <rect width="32" height="32" rx="6" fill="#030611" />
  
  <!-- Outer Orbit Ring (Gold / Teal Accent) -->
  <ellipse cx="16" cy="16" rx="12" ry="4.5" fill="none" stroke="goldenrod" stroke-width="1.2" transform="rotate(-25 16 16)" opacity="0.85" />
  
  <!-- Central Data Node / Pale Blue Dot -->
  <circle cx="16" cy="16" r="4" fill="#00e5ff" />
  <circle cx="16" cy="16" r="6" fill="#00e5ff" opacity="0.25" />
  
  <!-- Top Intersection Ring Arc (Gives 3D depth) -->
  <path d="M 6.2 11.2 A 12 4.5 0 0 1 25.8 20.8" fill="none" stroke="turquoise" stroke-width="1.2" transform="rotate(-25 16 16)" />
</svg>